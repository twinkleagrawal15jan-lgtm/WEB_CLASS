<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 100px;
            width: 100px;
            background-color: rgb(156, 225, 236);
            transition: width 2s, height 2s,rotate 3s;
            text-align: center;
            margin-left: 410px;
        }

        #div1 {
            transition-timing-function: linear;
        }

        #div2 {
            transition-timing-function: ease;
        }

        #div3 {
            transition-timing-function: ease-in;

        }

        #div4 {
            transition-timing-function: ease-out;

        }

        #div5 {
            transition-timing-function: ease-in-out;


        }

        #div1:hover {
            width: 300px;
            height: 300px;
            background-color: rgb(232, 232, 22);
            rotate: 360deg;
             border-radius: 50%;
        }

        #div2:hover {
            width: 300px;
            height: 300px;
            background-color: rgb(69, 47, 241);
              rotate: 360deg;
                  border-radius: 30%;
        }

        #div3:hover {
            width: 300px;
            height: 300px;
            background-color: rgb(224, 135, 51);
              rotate: 360deg;
              border-radius: 45%;
        }

        #div4:hover {
            width: 300px;
            height: 300px;
            background-color: rgb(248, 146, 230);
              rotate: 360deg;
                  border-radius: 30%;
        }

        #div5:hover {
            width: 300px;
            height: 300px;
            background-color: rgb(233, 18, 93);
              rotate: 360deg;
                  border-radius: 60%;
        }
    </style>
</head>

<body>
    <h1>timing function</h1><br>
    <div id="div1">linear</div><br>
    <div id="div2">ease</div><br>
    <div id="div3">ease-in</div><br>
    <div id="div4">ease-out</div><br>
    <div id="div5">ease-in-out</div><br>



</body>

</html>
