<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div {
        width: 100px;
        height: 100px;
        background: rgb(244, 131, 149);
        transition: height 2s, background-color 2s, transform 4s, border-radius 5s, translate 3s;


    }

    #div1 {
        transition-timing-function: linear;
        text-align: center;
    }

    #div2 {
        transition-timing-function: ease;
        text-align: center;
    }

    #div3 {
        transition-timing-function: ease-in;
        text-align: center;
    }

    #div4 {
        transition-timing-function: ease-in-out;
        text-align: center;
    }

    #div5 {
        transition-timing-function: ease-out;
        text-align: center;
    }

    div:hover {
        height: 100px;
        background-color: skyblue;
        transform: rotate(360deg);
        border-radius: 100px;
        translate: 100px;


    }
</style>

<body>
    <h1> Transition Delay Property </h1>
    <div>
        <div id="div1">Linear </div><br>
        <div id="div2">ease </div><br>
        <div id="div3">ease-in </div><br>
        <div id="div4">ease-in-out </div><br>
        <div id="div5">ease-out </div><br>

    </div>
</body>

</html>
