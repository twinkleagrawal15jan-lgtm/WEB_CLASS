<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 100px;
            width: 100px;
            background-color: rgb(67, 215, 238);
            transition: width 2s, height 2s, rotate 2s, translate 2s,border-radius 1s;
            text-align: center;

        }

        #div1 {
            transition-timing-function: linear;
        }

        div:hover {
            width: 300px;
            height: 300px;
            background-color: rgb(238, 69, 145);
            rotate: 360deg;
            border-radius: 50%;
            translate: 400px;
        }
    </style>
</head>

<body>
    <h1>from square to circle with translate</h1><br>
    <div id="div1">linear</div><br>




</body>

</html>
