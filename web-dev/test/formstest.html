<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
</head>
<body>
    <!-- Visible content goes here -->
     <fielsdet>
    <h1>Student Registration Form</h1>
    <p>Please fill in the details below.</p>
    <fieldset>
        <legend>Personal information</legend>
  
    <label for="name">Full Name: </label>
    <input type="text" id="name">
    <br>
    <br>
    <label for="numbers">Mobile Number: </label>
    <input type="text" id="numbers">
    <br>
    <br>
    <label for="mail">Email: </label>
    <input type="text" id="mail">
    <br>
    <br>
    <label for="pass">Password: </label>
    <input type="password" id="pass">
    <br>
    <br>
    <label for="age">Age: </label>
    <input type="number" id="age">
    <br>
    <br>
    <label for="gen">Gender: </label>
    <input type="radio" id="gen" name="gen" >Male
    <input type="radio" id="gen" name="gen" >Female
      </fieldset>
    <br>
    <br>
    <label for="dob">Date of Birth: </label>
    <input type="date" id="dob">
    <br>
    <br>
    <fieldset>
        <legend>Additional information</legend>
   
    <label for="interests">Interests:</label>
     <input type="checkbox" id="coding" name="interests" value="coding">
      <label for="coding">Coding</label>
      <input type="checkbox" id="sports" name="interests" value="sports">
      <label for="sports">Sports</label>
      <input type="checkbox" id="music" name="interests" value="music">
      <label for="music">Music</label>
      <br>
      <br>
    <label for="cou">Select Course:</label>
  <select name="cou" id="cou">
    <option value="BCA">BCA</option>
    
    <option value="BTECH">BTECH</option>
    <option value="BCOM">BCOM</option>
    <option value="BBA">BBA</option>
  </select>
   </fieldset>
  <br>
  <br>
    <label for="up">Upload Resume</label>
    <input type="file" id="up">
    <br>
    <br>
    <label for="mes">Why do you want to join the course?</label>
    <br>
    <textarea id="mes" name="mes" rows="5" cols="40"></textarea>
    <br>
    <br>
    <input type="button" value="Register">
    <input type="button" value="Reset">
    </fielsdet>
    </body>
</html>
