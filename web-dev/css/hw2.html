<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            position: relative;


            background-image: url('me.jpeg');
            /* background-size: cover; */
            background-position: center;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            color: aliceblue;
        }

        p {
            position: absolute;
            margin: 10px;
        }

        .top-left {
            top: 0px;
            left: 0px;
        }

        .top-right {
            top: 0px;
            right: 0px;
        }

        .top-center {
            left: 45%;
            right: 45%;
        }



        .bottom-right {
            bottom: 0px;
            right: 0px;
        }

        .bottom-left {
            bottom: 0px;
            left: 0px;
        }

        .bottom-center {
            bottom: 0px;
            left: 45%;
            right: 45%;
        }


        .mid-left {
            left: 0px;
            top: 45%;
        }

        .mid-right {
            right: 0px;
            top: 45%;
        }

        .mid-center {
            left: 45%;
            right: 45%;
            top: 45%;
        }
    </style>
</head>

<body>

    <p class="mid-center">Twinkle🌻</p>
    <p class="mid-left">Twinkle🌻</p>
    <p class="mid-right">Twinkle🌻</p>

    <p class="top-left">Twinkle💗</p>
    <p class="top-center">Twinkle💗</p>
    <p class="top-right">Twinkle💗</p>

    <p class="bottom-center">Twinkle✨</p>
    <p class="bottom-right">Twinkle✨</p>
    <p class="bottom-left">Twinkle✨</p>

</body>

</html>
