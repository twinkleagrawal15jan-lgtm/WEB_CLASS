<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning flex</title>
     <style>
        .container {
            display: flex;
            background-color: rgb(83, 199, 235);
            flex-direction: column-reverse;
            gap: 20px;
        }

        .container div {
            background-color:yellow;
            margin: 10px;
            padding: 20px;
            font-size: 24px;
        }
    </style>
</head>
<body>
     <h1>Create a Flex Container</h1>

    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>

</html>
