

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
.container {
  display: grid;

  grid-template-columns: repeat(3,1fr);
  grid-template-rows: repeat(3,1fr);
  place-items: center;
  height:100vh;

}

.card{
 background-color: #f1f1f1;

  border: 1px solid black;
  height:200px;
  width:200px;
 background-color: bisque;


}
@media(max-width:768px)
{
.container {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  grid-template-rows: repeat(3,1fr);
  place-items: center;
  height:100vh;

}
@media(max-width:600px)
{
.container {
  display: grid;
  grid-template-columns: repeat(1,1fr);
  grid-template-rows: repeat(3,1fr);
  place-items: center;
  height:100vh;

}
}

}

.card img{
    height: 100%;
    width: 100%;
}
</style>


<body>
    <h1>media query</h1>

<div class="container">
  <div class="card"><img src="me1.jpeg"></div>
  <div class="card"><img src="me2.jpeg"></div>
  <div class="card"><img src="me3.jpeg"></div>  
    <div class="card"><img src="me7.jpeg"></div>
  <div class="card"><img src="me8.jpeg"></div>
  <div class="card"><img src="me9.jpeg"></div>
  <div class="card"><img src="me4.jpeg"></div>
  <div class="card"><img src="me5.jpeg"></div>
  <div class="card"><img src="me6.jpeg"></div>

  
</div>

</body>
</html>
