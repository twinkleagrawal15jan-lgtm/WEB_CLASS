<!DOCTYPE html>

<head>

        }

            padding: 32px;
            margin: 30px;

            height: 20px;
            background-color: rgb(212, 212, 252);
            
        }

</head>

<body>
    <nav>

        </div>

        <div>
            <ul>

</html>
